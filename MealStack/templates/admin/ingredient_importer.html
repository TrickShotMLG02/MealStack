{% extends "admin/base_site.html" %}
{% block content %}
<h1>Ingredient Importer (OpenFoodFacts)</h1>
{% if message %}<p>{{ message }}</p>{% endif %}
<form method="post">
    {% csrf_token %}
    <label>EAN:</label>
    <input type="text" name="ean">
    <button type="submit">Import</button>
</form>
{% endblock %}
