{% extends "admin/base_site.html" %}
{% load i18n %}
{% block content %}
<h1>{{ site_name }}</h1>
{% if message %}<p>{{ message }}</p>{% endif %}
<form method="post">
    {% csrf_token %}
    <label>{% trans "Recipe URL" %}:</label>
    <input type="url" name="url" style="min-width: 32rem; max-width: 100%;" placeholder="{{ url_placeholder }}">
    <button type="submit">{% trans "Import" %}</button>
</form>
{% endblock %}
