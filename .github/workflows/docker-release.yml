name: Build & Publish Docker Image (Tag)

on:
  push:
    tags:
      - "v*"

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/mealstack

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Set up QEMU for cross-platform builds
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract tag name
        id: tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Validate tag against branch
        run: |
          TAG="${{ steps.tag.outputs.tag }}"

          git fetch --prune --unshallow origin +refs/heads/*:refs/remotes/origin/*

          BRANCHES=$(git branch -r --contains HEAD | sed 's/origin\///')

          echo "Tag: $TAG"
          echo "Branches containing commit: $BRANCHES"

          if [[ "$TAG" == *"-dev" ]]; then
            if [[ "$BRANCHES" != *"development"* ]]; then
              echo "❌ Dev tag ($TAG) must be created from the dev branch"
              exit 1
            fi
          else
            if [[ "$BRANCHES" != *"master"* ]]; then
              echo "❌ Release tag ($TAG) must be created from the master branch"
              exit 1
            fi
          fi

      - name: Determine Docker tags
        id: meta
        run: |
          TAG="${{ steps.tag.outputs.tag }}"

          if [[ "$TAG" == *"-dev" ]]; then
            echo "docker_tags=${IMAGE_NAME}:${TAG},${IMAGE_NAME}:dev" >> $GITHUB_OUTPUT
          else
            echo "docker_tags=${IMAGE_NAME}:${TAG},${IMAGE_NAME}:latest" >> $GITHUB_OUTPUT

      # Build and push multi-platform image using Buildx
      - name: Build and push Docker image (multi-platform)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.docker_tags }}
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/arm/v6