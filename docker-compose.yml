services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    env_file:
      - docker-compose.env
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mealstack-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-umealstack", "-pmealstack"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
      - docker-compose.env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - mealstack-media:/app/media
    entrypoint:
      - /bin/sh
      - -c
      - uv run python manage.py migrate --noinput && exec uv run python manage.py runserver 0.0.0.0:8000

volumes:
  mealstack-db:
  mealstack-media:
